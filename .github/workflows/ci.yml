name: Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

jobs:
  validate-daemon:
    name: Validate Daemon (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go Format Check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Run gofmt on the following files:"
            gofmt -l .
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Go Test
        run: go test -v ./...

      # Security Scan (Go)
      - name: Run Trivy vulnerability scanner (Repo)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "table"
          severity: "CRITICAL,HIGH"

  database-integration:
    name: Database manager (MariaDB, MySQL, PostgreSQL)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ["mariadb:11", "mysql:8.4"]
    services:
      mysql:
        image: ${{ matrix.mysql }}
        env:
          MARIADB_ROOT_PASSWORD: pw
          MYSQL_ROOT_PASSWORD: pw
        ports: ["3306:3306"]
        options: >-
          --name sld-ci-mysql
          --health-cmd "mariadb-admin ping -h127.0.0.1 -ppw || mysqladmin ping -h127.0.0.1 -ppw"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --name sld-ci-pg
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Real servers: per-database pools, transactions, quoting, masking,
      # and dumps/restores/clones run inside the server containers.
      - name: Driver integration tests
        env:
          SLD_STATE_DIR: ${{ runner.temp }}/sld
          SLD_TEST_MYSQL: root:pw@127.0.0.1:3306
          SLD_TEST_PG: postgres:pw@127.0.0.1:5432
          SLD_TEST_MYSQL_CONTAINER: sld-ci-mysql
          SLD_TEST_PG_CONTAINER: sld-ci-pg
        run: go test -race -count=1 -v -run Integration ./pkg/services

  validate-ui:
    name: Validate UI (React/Tauri)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sld-dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: sld-dashboard/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # If there's a type-check script (tsk), run it. Assuming standard vite setup often has `tsc -b` in build `build`.
      - name: Type Check
        run: npx tsc --noEmit
