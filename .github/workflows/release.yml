name: Release Pipeline

on:
  push:
    tags:
      - "v*"

permissions:
  contents: "write"

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  sync-version:
    name: Sync Repository Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Files
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_CLEAN=${VERSION#v}
          echo "Updating source files to $VERSION_CLEAN"
          
          # Update sld-dashboard/package.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('sld-dashboard/package.json')); p.version='$VERSION_CLEAN'; fs.writeFileSync('sld-dashboard/package.json', JSON.stringify(p, null, 2) + '\n')"
          
          # Update sld-dashboard/src-tauri/tauri.conf.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('sld-dashboard/src-tauri/tauri.conf.json')); p.version='$VERSION_CLEAN'; fs.writeFileSync('sld-dashboard/src-tauri/tauri.conf.json', JSON.stringify(p, null, 2) + '\n')"
          
          # Update sld-dashboard/src-tauri/Cargo.toml
          node -e "const fs=require('fs'); const c=fs.readFileSync('sld-dashboard/src-tauri/Cargo.toml', 'utf8'); fs.writeFileSync('sld-dashboard/src-tauri/Cargo.toml', c.replace(/^version = \".*\"/m, 'version = \"$VERSION_CLEAN\"'))"

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: bump version to ${{ github.ref_name }} [skip ci]" || exit 0
          git push origin main

  build-daemon:
    name: Build Daemon (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output_name: sld-linux-amd64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            output_name: sld-darwin-amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            output_name: sld-windows-amd64.exe
          - os: macos-latest
            goos: darwin
            goarch: arm64
            output_name: sld-darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Binary
        working-directory: cmd/sld
        run: |
          go build -ldflags "-X main.Version=${{ github.ref_name }}" -o ../../bin/${{ matrix.output_name }} .
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/${{ matrix.output_name }}

  package-daemon-linux:
    name: Package Daemon (Linux .deb)
    needs: build-daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: daemon-linux-amd64
          path: bin

      - name: Install FPM
        run: sudo apt-get install -y ruby ruby-dev rubygems build-essential && sudo gem install --no-document fpm

      - name: Create Deb
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          chmod +x bin/sld-linux-amd64
          chmod +x scripts/packaging/postinst
          fpm -s dir -t deb \
            -n supreme-local-dev \
            -v $VERSION \
            -a amd64 \
            --description "Supreme Local Dev Daemon" \
            --url "https://github.com/supreme-majesty/supreme-local-dev" \
            --maintainer "Supreme <dev@supreme.local>" \
            --after-install scripts/packaging/postinst \
            bin/sld-linux-amd64=/usr/bin/sld

      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: sld-deb
          path: "*.deb"

  package-daemon-macos:
    name: Package Daemon (macOS .pkg)
    needs: build-daemon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS Binary
        uses: actions/download-artifact@v4
        with:
          name: daemon-darwin-amd64
          path: bin

      - name: Create PKG Installer
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          chmod +x bin/sld-darwin-amd64
          mkdir -p pkg-root/usr/local/bin
          cp bin/sld-darwin-amd64 pkg-root/usr/local/bin/sld

          # Create component plist
          pkgbuild --analyze --root pkg-root component.plist

          # Build the package
          pkgbuild \
            --root pkg-root \
            --scripts scripts/packaging/macos \
            --identifier com.supreme-local-dev.sld \
            --version $VERSION \
            --install-location / \
            --component-plist component.plist \
            supreme-local-dev_${VERSION}_amd64.pkg

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: sld-pkg
          path: "*.pkg"

  package-daemon-windows:
    name: Package Daemon (Windows .msi)
    needs: build-daemon
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: daemon-windows-amd64
          path: bin

      - name: Create MSI Installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')

          # Create WiX source file (WiX v4 format for WiX v5 toolset)
          @"
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://wixtoolset.org/schemas/v4/wxs">
            <Package Name="Supreme Local Dev"
                     Language="1033"
                     Version="$version.0"
                     Manufacturer="Supreme"
                     UpgradeCode="8B7E9A5C-3D2F-4E1A-B8C4-9F6E7D2A1B3C"
                     Scope="perMachine">
              <MajorUpgrade DowngradeErrorMessage="A newer version is already installed." />
              <MediaTemplate EmbedCab="yes" />
              <StandardDirectory Id="ProgramFiles64Folder">
                <Directory Id="INSTALLFOLDER" Name="Supreme Local Dev">
                  <Component Id="SldExe" Guid="*">
                    <File Id="SldExeFile" Source="bin\sld-windows-amd64.exe" Name="sld.exe" KeyPath="yes" />
                  </Component>
                </Directory>
              </StandardDirectory>
              <Feature Id="ProductFeature" Title="Supreme Local Dev" Level="1">
                <ComponentRef Id="SldExe" />
              </Feature>

              <!-- Run sld install after files are copied -->
              <CustomAction Id="RunInstall" FileRef="SldExeFile" ExeCommand="install" Execute="deferred" Impersonate="no" Return="check" />

              <InstallExecuteSequence>
                <Custom Action="RunInstall" After="InstallFiles">NOT Installed</Custom>
              </InstallExecuteSequence>
            </Package>
          </Wix>
          "@ | Out-File -Encoding utf8 sld.wxs

          # Install WiX toolset
          dotnet tool install --global wix --version 4.0.5

          # Build MSI
          wix build sld.wxs -o supreme-local-dev_${version}_amd64.msi

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: sld-msi
          path: "*.msi"

  build-ui:
    name: Build UI (Tauri)
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: sld-dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: sld-dashboard/package-lock.json

      - name: Sync version from tag
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_CLEAN=${VERSION#v}
          echo "Syncing version to $VERSION_CLEAN"
          
          # Update package.json version
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json')); p.version='$VERSION_CLEAN'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2))"
          
          # Update tauri.conf.json version
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')); p.version='$VERSION_CLEAN'; fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(p, null, 2))"
          
          # Update Cargo.toml version
          node -e "const fs=require('fs'); const c=fs.readFileSync('src-tauri/Cargo.toml', 'utf8'); fs.writeFileSync('src-tauri/Cargo.toml', c.replace(/^version = \".*\"/m, 'version = \"$VERSION_CLEAN\"'))"

      - name: Install Rust (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are typically added automatically by tauri-action but explicit is safe
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing secrets placeholders
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        with:
          projectPath: sld-dashboard
          tagName: ${{ github.ref_name }}
          releaseName: "Supreme Local Dev ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-release:
    name: Publish Release
    needs:
      [
        build-daemon,
        package-daemon-linux,
        package-daemon-macos,
        package-daemon-windows,
        build-ui,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Daemon Assets
        uses: actions/download-artifact@v4
        with:
          pattern: "daemon-*"
          path: assets/daemon
          merge-multiple: true

      - name: Download Deb Assets
        uses: actions/download-artifact@v4
        with:
          name: sld-deb
          path: assets/deb

      - name: Download PKG Assets
        uses: actions/download-artifact@v4
        with:
          name: sld-pkg
          path: assets/pkg

      - name: Download MSI Assets
        uses: actions/download-artifact@v4
        with:
          name: sld-msi
          path: assets/msi

      # Tauri action uploads its own assets to the release draft automatically.
      # We just need to upload the extra daemon binaries and packages to the SAME release.

      - name: Upload All Assets to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            assets/daemon/*
            assets/deb/*.deb
            assets/pkg/*.pkg
            assets/msi/*.msi
