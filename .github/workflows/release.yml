name: Release Pipeline

on:
  push:
    tags:
      - "v*"

permissions:
  contents: "write"

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  sync-version:
    name: Sync Repository Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Files
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_CLEAN=${VERSION#v}
          echo "Updating source files to $VERSION_CLEAN"
          
          # Update sld-dashboard/package.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('sld-dashboard/package.json')); p.version='$VERSION_CLEAN'; fs.writeFileSync('sld-dashboard/package.json', JSON.stringify(p, null, 2) + '\n')"
          
          # Update sld-dashboard/src-tauri/tauri.conf.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('sld-dashboard/src-tauri/tauri.conf.json')); p.version='$VERSION_CLEAN'; fs.writeFileSync('sld-dashboard/src-tauri/tauri.conf.json', JSON.stringify(p, null, 2) + '\n')"
          
          # Update sld-dashboard/src-tauri/Cargo.toml
          node -e "const fs=require('fs'); const c=fs.readFileSync('sld-dashboard/src-tauri/Cargo.toml', 'utf8'); fs.writeFileSync('sld-dashboard/src-tauri/Cargo.toml', c.replace(/^version = \".*\"/m, 'version = \"$VERSION_CLEAN\"'))"

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: bump version to ${{ github.ref_name }} [skip ci]" || exit 0
          git push origin main

  build-daemon:
    name: Build Daemon (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output_name: sld-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            output_name: sld-linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            output_name: sld-darwin-amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            output_name: sld-windows-amd64.exe
          - os: macos-latest
            goos: darwin
            goarch: arm64
            output_name: sld-darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Binary
        working-directory: cmd/sld
        run: |
          go build -ldflags "-X main.Version=${{ github.ref_name }}" -o ../../bin/${{ matrix.output_name }} .
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/${{ matrix.output_name }}


  build-ui:
    name: Build UI (Tauri)
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: sld-dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: sld-dashboard/package-lock.json

      - name: Sync version from tag
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_CLEAN=${VERSION#v}
          echo "Syncing version to $VERSION_CLEAN"
          
          # Update package.json version
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json')); p.version='$VERSION_CLEAN'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2))"
          
          # Update tauri.conf.json version
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')); p.version='$VERSION_CLEAN'; fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(p, null, 2))"
          
          # Update Cargo.toml version
          node -e "const fs=require('fs'); const c=fs.readFileSync('src-tauri/Cargo.toml', 'utf8'); fs.writeFileSync('src-tauri/Cargo.toml', c.replace(/^version = \".*\"/m, 'version = \"$VERSION_CLEAN\"'))"

      - name: Install Rust (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are typically added automatically by tauri-action but explicit is safe
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing secrets placeholders
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        with:
          projectPath: sld-dashboard
          tagName: ${{ github.ref_name }}
          releaseName: "Supreme Local Dev ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  publish-release:
    name: Publish Release
    needs: [build-daemon, build-ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      # Host installers (.deb/.pkg/.msi with a system daemon) are no longer built:
      # SLD ships as a Docker image (docker.io/insightifytech/sld). The plain CLI binaries
      # remain for people who run SLD without the image.
      - name: Checksums
        run: |
          mkdir -p dist
          find all-artifacts -path '*daemon-*' -type f -exec cp {} dist/ ;
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload All Assets to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*
