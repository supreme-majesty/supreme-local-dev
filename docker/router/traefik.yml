entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
    network: "sld-global"
    watch: true
  file:
    directory: "/etc/traefik/dynamic"
    watch: true

api:
  dashboard: false

ping: {}

accessLog:
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
