name: sld

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sld:local
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SLD_BIND_HOST:-127.0.0.1}:${SLD_PORT:-2025}:2025"
    environment:
      SLD_SKIP_INSTALL: "1"
      SLD_STATE_DIR: /home/sld/.sld
      SLD_DB_HOST: mariadb
      SLD_DB_PORT: "3306"
      SLD_DB_USER: root
      SLD_DB_PASS: ${MYSQL_ROOT_PASSWORD:-sld}
      SLD_PG_HOST: postgres
      SLD_PG_PORT: "5432"
      SLD_PG_USER: ${POSTGRES_USER:-sld}
      SLD_PG_PASS: ${POSTGRES_PASSWORD:-sld}
      SLD_PG_DB: ${POSTGRES_DB:-app}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    volumes:
      - sld-state:/home/sld/.sld
      - /var/run/docker.sock:/var/run/docker.sock
    # Docker Desktop socket is root:root mode 660; join gid 0 so local container discovery works.
    group_add:
      - "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - sld-net
    restart: unless-stopped

  mariadb:
    image: mariadb:11.4
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sld}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
    ports:
      - "${SLD_BIND_HOST:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - sld-mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - sld-net
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    security_opt:
      - no-new-privileges:true
    environment:
      PMA_HOST: mariadb
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sld}
      UPLOAD_LIMIT: 64M
    ports:
      - "${SLD_BIND_HOST:-127.0.0.1}:${PMA_PORT:-8080}:80"
    volumes:
      - ./docker/phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 80) ? 0 : 1);'"]
      interval: 15s
      timeout: 3s
      retries: 5
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - sld-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SLD_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - sld-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sld-net
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.2
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SLD_BIND_HOST:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${SLD_BIND_HOST:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks:
      - sld-net
    restart: unless-stopped

  postgres:
    profiles: ["postgres"]
    image: postgres:16
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sld}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sld}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${SLD_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sld-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sld} -d $${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sld-net
    restart: unless-stopped

networks:
  sld-net:
    driver: bridge

volumes:
  sld-state:
  sld-mariadb:
  sld-postgres:
  sld-redis:
